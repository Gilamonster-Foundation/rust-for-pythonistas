[package]
name = "ch08-escaping-the-gil"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Chapter 8: Escaping the GIL — Send/Sync, rayon, and real threads"

[dependencies]
rayon = "1"

# PyO3 is optional: the `python` feature is OFF by default, so building and
# testing this chapter requires no Python installation. Enable it with
# `cargo build -p ch08-escaping-the-gil --features python` to compile the
# GIL-releasing extension example.
pyo3 = { version = "0.23", optional = true, features = ["extension-module", "abi3-py39"] }

[features]
python = ["dep:pyo3"]
