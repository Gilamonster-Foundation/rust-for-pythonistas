# HOOK PARITY: This workflow mirrors .pre-commit-config.yaml.
# When editing this file, update the pre-commit config to match.

name: Safety Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Scan for secrets
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --verbose

  forbidden-patterns:
    name: Check forbidden patterns
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan for forbidden patterns
        run: |
          PATTERNS=(
            '192\.168\.[0-9]+\.[0-9]+'
            '/home/[a-z][a-z0-9_-]+/'
            'geforcenuc|gnuc[^a-z]'
            'server1[^a-z]'
            'BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY'
          )

          FAILED=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rEn "$pattern" --include='*.rs' --include='*.py' \
               --include='*.toml' --include='*.yml' --include='*.yaml' \
               --include='*.md' --include='*.json' --include='*.sh' \
               . 2>/dev/null | grep -v '.git/' | grep -v 'safety-gate.yml' \
               | grep -v 'CLAUDE.md' | grep -v '.pre-commit-config.yaml'; then
              echo "::error::Forbidden pattern found: $pattern"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "No forbidden patterns found."

  rust-checks:
    name: Rust lint and test
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (excluding unsolved exercises)
        run: |
          # Auto-discover exercise crates (they contain todo!() stubs)
          # and exclude them from the test run. Exercises are compiled by
          # the clippy step above, so broken stubs still fail CI.
          EXCLUDES=()
          for crate in $(cargo metadata --no-deps --format-version 1 \
                         | python3 -c "import json,sys; [print(p['name']) for p in json.load(sys.stdin)['packages']]" \
                         | grep -- '-exercises$'); do
            EXCLUDES+=(--exclude "$crate")
          done
          echo "Excluding: ${EXCLUDES[*]}"
          cargo test --workspace "${EXCLUDES[@]}"
